
name: Spring Boot CI

on:
  pull_request:
    branches: [ main ]

jobs:
  spring-tests:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Run Spring tests
        run: mvn clean verify
        working-directory: back/spring



  react-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install + test
        working-directory: front/react
        run: |
          npm ci
          npm test

