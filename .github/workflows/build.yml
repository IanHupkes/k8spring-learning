
name: k8spring ci

on:
  pull_request:
    branches: [ main ]

jobs:

  # spring test
  spring-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Run Spring tests
        run: mvn clean verify
        working-directory: back/spring

  # react test
  react-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: front/react
        run: npm ci

      - name: Run lint
        working-directory: front/react
        run: npm run lint

      - name: Run tests
        working-directory: front/react
        run: npm test

  # build
  build:
    runs-on: ubuntu-latest
    needs: [ spring-tests, react-tests ]

    steps:
      - uses: actions/checkout@v4

      # setup java version
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # TEMP debug java version
      - name: Verify Java
        run: |
          java -version
          mvn -version

      # spring build
      - name: Build backend (Spring)
        run: mvn clean package -DskipTests
        working-directory: back/spring

      # react build
      - name: Build frontend (React)
        run: |
          npm ci
          npm run build
        working-directory: front/react

  # security checks (dependency scanning)
  security-checks:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      # node setup (voor npm audit)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # npm audit
      - name: Run npm audit
        working-directory: front/react
        run: |
          npm ci
          npm audit --audit-level=high

      # java setup
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'


      # OWASP dependency check
      - name: Debug API key presence
        run: |
          if [ -z "${{ secrets.NVD_API_KEY }}" ]; then
            echo "KEY IS EMPTY"
            exit 1
          else
            echo "KEY IS SET"
          fi

      - name: Cache OWASP data
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: owasp-db

      - name: Run OWASP dependency check
        run: mvn org.owasp:dependency-check-maven:check -Ddependency-check.nvd.apiKey=${{ secrets.NVD_API_KEY }}
        working-directory: back/spring


  # docker build
  docker-build:
    runs-on: ubuntu-latest
    needs: security-checks

    steps:
      - uses: actions/checkout@v4

      # build images
      - name: Build Docker images
        run: docker compose build
        env:
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test

      - name: Scan backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ianhupkes09987/k8spring-learning-api'
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: HIGH,CRITICAL


      - name: Scan frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ianhupkes09987/k8spring-learning-web'
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: HIGH,CRITICAL


      # 🔐 login
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 📤 push
      - name: Push Docker images
        run: docker compose push


