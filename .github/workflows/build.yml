
name: Spring Boot CI

on:
  pull_request:
    branches: [ main ]
#  push:
#    branches: [ main ]

jobs:
  spring:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Run Spring tests
        run: mvn clean verify
        working-directory: back/spring



